name: Publish to GitHub Releases

on:
  push:
    tags:
      - "llamaindex@*"

permissions:
  contents: read

jobs:
  build-and-publish:
    permissions:
      contents: write  # for ncipollo/release-action to create a release
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit

      - name: Checkout Repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: step-security/action-setup@0ad50dc56a23060fa78b14cfcf0677c4e14b42bc # v5.0.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Build tarball
        run: |
          pnpm pack
        working-directory: packages/llamaindex

      - name: Create release
        uses: step-security/release-action@a0d8e0f90f554c15366ca2c9046bf4090d24adbe # v1.21.0
        with:
          artifacts: "packages/llamaindex/llamaindex-*.tgz"
          name: Release ${{ github.ref }}
          bodyFile: "packages/llamaindex/CHANGELOG.md"
          token: ${{ secrets.GITHUB_TOKEN }}
